name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Atualizar versão no module.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Atualizando module.json para a versão $VERSION"
          jq --arg v "$VERSION" '.version = $v' module.json > temp.json && mv temp.json module.json

      - name: Compactar o módulo
        run: |
          zip -r module.zip module.json scripts README.md LICENSE 2>/dev/null || true

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
